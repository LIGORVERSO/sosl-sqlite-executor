name: Local Reader portability regression

on:
  push:
    branches: [main]
    paths:
      - "src/local-reader.mjs"
      - "src/reader-contract.mjs"
      - "scripts/local-reader-regression.mjs"
      - ".github/workflows/local-reader-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SOSL_DATABASE_ID: gil-main
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Download stable snapshot readonly
        run: |
          mkdir -p work/outer work/inner
          SOSL_SNAPSHOT_DOWNLOAD_PATH=work/snapshot-bundle.zip node scripts/download-stable-snapshot.mjs
          unzip -q work/snapshot-bundle.zip -d work/outer
          unzip -q work/outer/GIL_SQLITE_SNAPSHOT_CURRENT.zip -d work/inner
          DB="$(find work/inner -type f \( -name '*.db' -o -name '*.sqlite' \) | head -n 1)"
          test -n "$DB"
          echo "SOSL_SQLITE_PATH=$PWD/$DB" >> "$GITHUB_ENV"
      - name: Run Reader portability regression
        run: node scripts/local-reader-regression.mjs
