name: Publication capability preflight

on:
  push:
    branches: [main]
    paths:
      - "scripts/publication-capability-preflight.mjs"
      - "src/control-discovery.mjs"
      - "src/google-readonly.mjs"
      - ".github/workflows/publication-capability-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SOSL_DATABASE_ID: gil-main
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify edit capability without mutation
        run: node scripts/publication-capability-preflight.mjs
