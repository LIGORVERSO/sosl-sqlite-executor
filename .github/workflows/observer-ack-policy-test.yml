name: Executor safety regressions

on:
  push:
    branches: [main]
    paths:
      - "src/observer-ack-policy.mjs"
      - "test/observer-ack-policy.test.mjs"
      - "test/observer-apps-script-dirty.test.mjs"
      - "apps-script/observer-v0.2.0/Code.gs"
      - "apps-script/observer-v0.2.1/Code.gs"
      - "src/corpus-registry.js"
      - "src/corpus-reconciler.js"
      - "test/corpus-registry.test.mjs"
      - "src/corpus-retirement.js"
      - "src/retirement-guard.js"
      - "test/retirement-lifecycle.test.mjs"
      - "src/local-manifest.mjs"
      - "test/local-manifest-write.test.mjs"
      - ".github/workflows/observer-ack-policy-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Run observer acknowledgement regression
        run: node --test test/observer-ack-policy.test.mjs test/observer-apps-script-dirty.test.mjs test/corpus-registry.test.mjs test/retirement-lifecycle.test.mjs test/local-manifest-write.test.mjs
