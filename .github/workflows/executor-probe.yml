name: SOSL SQLite executor probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sosl-sqlite-executor-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run isolated SQLite probe
        run: node src/probe.mjs
