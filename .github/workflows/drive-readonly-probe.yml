name: Google Drive readonly credential probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sosl-drive-readonly-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Probe Google Drive metadata with readonly OAuth scope
        run: node src/drive-readonly-probe.mjs
