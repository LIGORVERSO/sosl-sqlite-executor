name: SOSL SQLite executor v0.2

on:
  workflow_dispatch:
    inputs:
      database_id:
        description: Database ID from GIL_SQLITE_CONTROLE_EXECUCAO
        required: true
        type: string
      observer_contract:
        description: Observer contract
        required: false
        type: string
      trigger_reason:
        description: Aggregated dirty reason
        required: false
        type: string
      dirty_files_json:
        description: Observed Drive file IDs and revisions from observer
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sosl-sqlite-executor-${{ inputs.database_id }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SOSL_DATABASE_ID: ${{ inputs.database_id }}
      SOSL_OBSERVER_CONTRACT: ${{ inputs.observer_contract }}
      SOSL_TRIGGER_REASON: ${{ inputs.trigger_reason }}
      SOSL_DIRTY_FILES_JSON: ${{ inputs.dirty_files_json }}
      SOSL_BODY_SYNC_REPORT: work/body-sync-report.json
      SOSL_MANIFEST_REPORT: work/manifest-report.json
      SOSL_BUNDLE_PATH: work/GIL_SQLITE_SNAPSHOT_CURRENT.next.zip
      SOSL_BUILD_REPORT: work/build-report.json
      SOSL_PUBLISH_REPORT: work/publish-report.json
      SOSL_PUBLISH_MODE: COMMIT

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install parser dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate localized freeze and absent-source contracts
        run: |
          node --check scripts/registry-apply-v0.1.mjs
          node --check scripts/retirement-reconcile-local.mjs
          node --check scripts/body-sync-local.mjs
          node --check src/local-manifest.mjs
          node scripts/localized-freeze-selftest.mjs
          node scripts/manifest-absent-metadata-selftest.mjs

      - name: Enforce live activation control before any Drive mutation
        run: node scripts/executor-activation-guard.mjs

      - name: Download current stable snapshot readonly with pinned base version
        shell: bash
        run: |
          mkdir -p work/outer work/inner
          SOSL_SNAPSHOT_DOWNLOAD_PATH=work/snapshot-bundle.zip \
            node scripts/download-stable-snapshot.mjs
          unzip -q work/snapshot-bundle.zip -d work/outer
          unzip -q work/outer/GIL_SQLITE_SNAPSHOT_CURRENT.zip -d work/inner
          DB="$(find work/inner -type f \( -name '*.db' -o -name '*.sqlite' \) | head -n 1)"
          test -n "$DB"
          cp "$DB" work/executor.db
          echo "SOSL_SQLITE_PATH=$PWD/work/executor.db" >> "$GITHUB_ENV"

      - name: Reconcile KRG1 membership and derived control plane locally
        run: node scripts/registry-apply-v0.1.mjs

      - name: Advance retirement authorization guards
        run: node scripts/retirement-reconcile-local.mjs

      - name: Finalize guarded retirements
        run: node scripts/retirement-finalize-local.mjs

      - name: Materialize new bodies and apply live body deltas
        run: node scripts/body-sync-local.mjs

      - name: Rebuild manifest preview from live authority
        run: node scripts/manifest-preview-v0.1.mjs

      - name: Reader compatibility gate
        run: node scripts/local-reader-regression.mjs

      - name: Build self-certifying replacement bundle
        run: |
          python3 scripts/build_snapshot_bundle.py \
            --db "$SOSL_SQLITE_PATH" \
            --report-out "$SOSL_BUILD_REPORT" \
            --out "$SOSL_BUNDLE_PATH"

      - name: Publish same Drive file ID, read back, then atomically acknowledge manifest
        run: node scripts/publish-snapshot-v0.1.mjs

      - name: Verify publication report exists
        run: |
          test -s "$SOSL_PUBLISH_REPORT"
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const r=JSON.parse(await readFile(process.env.SOSL_PUBLISH_REPORT,"utf8"));
          if(!r.ok||!r.publication_attempted||!r.manifest_write_attempted){
            throw new Error("executor publication report incomplete");
          }
          console.log("EXECUTOR_PUBLICATION_OK",JSON.stringify({
            snapshot_version:r.stable_after_version,
            manifest_status:r.manifest_snapshot_status,
            krg1_revision:r.snapshot_krg1_membership_revision
          }));
          NODE
